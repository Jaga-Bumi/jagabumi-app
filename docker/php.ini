; PHP Configuration for Large File Uploads (Quest Video Submissions)

; Maximum file upload size (3GB)
upload_max_filesize = 3G

; Maximum POST data size (3GB + overhead)
post_max_size = 3G

; Maximum execution time for uploads (30 minutes)
max_execution_time = 1800

; Maximum input time for uploads (30 minutes)
max_input_time = 1800

; Memory limit (512MB should be enough for handling upload metadata)
memory_limit = 512M
